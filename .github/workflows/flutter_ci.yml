name: Flutter CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  # Branches are merged into main locally, so a pull_request-only trigger never
  # tests main itself. Between 2026-08-21 and 2026-08-25 main carried twelve
  # file-size ratchet violations that only surfaced on unrelated dependabot
  # PRs, where the red was read as the bump's fault.
  push:
    branches:
      - main

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  # A superseded run on a feature branch is noise, but every commit that lands
  # on main should be reported on.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  generated-files:
    name: Generated Files
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Flutter version from .fvmrc
        id: flutter-version
        shell: bash
        run: |
          version="$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)"
          if [ -z "$version" ]; then
            echo "Could not read Flutter version from .fvmrc."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify generated files are up to date
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Ensure generated files were committed
        env:
          # Dependabot's pub updater rewrites pubspec.lock with a stock Dart
          # resolver that ignores the packages the pinned Flutter SDK vendors,
          # so its lock always drifts and turned even no-op patch bumps red
          # (e.g. #179, sqlite3 3.5.1 -> 3.5.2). Tolerate a lock-only mismatch
          # on Dependabot PRs and surface the corrected lock as an artifact;
          # generated Dart files stay strict, as does the lock everywhere else.
          ALLOW_LOCK_DRIFT: ${{ github.actor == 'dependabot[bot]' && '1' || '0' }}
        run: bash tool/check_generated_files_clean.sh

      - name: Upload Flutter-resolved pubspec.lock
        if: always() && github.actor == 'dependabot[bot]'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-resolved-pubspec-lock
          path: pubspec.lock
          if-no-files-found: warn

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Flutter version from .fvmrc
        id: flutter-version
        shell: bash
        run: |
          version="$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)"
          if [ -z "$version" ]; then
            echo "Could not read Flutter version from .fvmrc."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true

      - name: Analyze project and internal packages
        run: bash tool/codex_verify.sh --no-codegen --no-tests

  test:
    name: Test
    runs-on: ubuntu-latest
    # Full suite plus coverage is ~20 minutes on ubuntu-latest; keep headroom.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Flutter version from .fvmrc
        id: flutter-version
        shell: bash
        run: |
          version="$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)"
          if [ -z "$version" ]; then
            echo "Could not read Flutter version from .fvmrc."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true

      - name: Run tests with coverage
        run: bash tool/codex_verify.sh --no-codegen --no-analyze --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
