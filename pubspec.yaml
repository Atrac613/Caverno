name: caverno
description: "A Flutter chat client for OpenAI-compatible LLM APIs."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.3.19+31

environment:
  sdk: ^3.10.8

workspace:
  - packages/caverno_content_protocol
  - packages/caverno_execution_runtime
  - packages/caverno_tool_contracts

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Shared parsing contract for streamed LLM content and tool-call markup
  caverno_content_protocol: ^0.1.0

  # Shared runtime contract for GUI, headless, and terminal frontends
  caverno_execution_runtime: ^0.1.0

  # Shared approval and capability contracts for tool execution
  caverno_tool_contracts: ^0.1.0

  cupertino_icons: ^1.0.9

  # Internationalization
  easy_localization: ^3.0.7

  # State management
  flutter_riverpod: ^3.4.2

  # OpenAI-compatible API client
  openai_dart: ^8.1.0

  # Immutable models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # Utilities
  uuid: ^4.6.0
  crypto: ^3.0.7
  # Direct import for Remote Coding self-signed WSS identities (SEC4.5c).
  # Already a transitive dartssh2 dependency; pin the same major here.
  pointycastle: ^4.0.0
  # Runtime evidence paths and lexical-guard tests both require canonical
  # relative path handling; avoid a second hand-rolled normalizer.
  path: ^1.9.0

  # Local storage
  shared_preferences: ^2.5.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # HTTP
  http: ^1.2.2

  # Network tools
  dart_ping: ^10.0.1
  multicast_dns: ^0.3.2+1

  # Image picker
  image_picker: ^1.2.3

  # PDF text extraction for chat attachments and read_file/inspect_file.
  # Pure Dart on purpose: a PDFium-backed plugin would add Mach-O binaries to
  # the macOS bundle and a new signing/notarization root, which python.bundle
  # has already cost us once.
  # Held below 33.2.13: from 33.2.13+1 it needs xml ^7, which needs
  # petitparser ^7, while serious_python -> toml 0.15 pins petitparser ^6.
  # Raising this requires serious_python to ship a newer toml first.
  # The upper bound is closed so a lockfile refresh cannot walk onto 33.2.13+1.
  syncfusion_flutter_pdf: '>=33.2.12 <33.2.13'

  # Speech I/O
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  # LaTeX math rendering for `$...$` / `$$...$$` spans in LLM markdown output
  flutter_math_fork: ^0.7.4
  url_launcher: ^6.3.2

  # Voice mode (Whisper STT + VOICEVOX TTS)
  audioplayers: ^6.8.1
  record: ^7.1.1
  path_provider: ^2.1.6

  # Local notifications
  flutter_local_notifications: ^22.3.0
  file_picker: ^11.0.3
  super_clipboard: ^0.9.1

  # Video attachment playback and sharing. video_player covers iOS, Android and
  # macOS; Windows and Linux have no implementation, so the viewer there offers
  # download only rather than pulling in a bundled libmpv for two platforms.
  video_player: ^2.14.0
  # Held at 12.x: 13.1.0+ moved to win32 ^6, which network_info_plus ^7 (used
  # by the Wi-Fi tools) cannot take. Upgrading both is a separate change.
  share_plus: ^12.0.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

  # Desktop window management
  window_manager: ^0.5.2

  # SSH remote server tool
  dartssh2: ^3.3.1
  flutter_secure_storage: ^10.0.0

  # BLE (Bluetooth Low Energy) tool
  bluetooth_low_energy: ^6.2.1

  # WiFi scanning tool
  wifi_scan: ^0.4.1
  network_info_plus: ^7.0.0
  desktop_drop: ^0.8.2

  # AC/battery power state for the LL18 idle-maintenance gate
  # (macOS/Windows/Linux/iOS/Android)
  battery_plus: ^7.1.1

  # Serial port tool (desktop only: macOS/Windows/Linux)
  flutter_libserialport: ^0.6.0

  # Built-in agent-controlled browser tool (iOS/Android/macOS/Windows)
  flutter_inappwebview: ^6.1.5

  # Embedded Python runtime for on-device LLM script execution
  # (iOS/Android/macOS/Windows/Linux). Runs a long-lived worker that the Dart
  # side drives over a loopback channel; see core/services/script_runtime.
  serious_python: ^4.5.1
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.6.0+eol
  # Embedded terminal for the coding workspace bottom panel (desktop only:
  # macOS/Windows/Linux). xterm renders the screen buffer, flutter_pty spawns
  # the login shell behind it; see features/chat/presentation/widgets/terminal.
  xterm: ^4.0.0
  flutter_pty: ^0.4.2
  firebase_core: ^4.13.0
  firebase_messaging: ^16.6.0
  firebase_app_check: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Testing
  analyzer: ^10.2.0
  coverage: ^1.15.1
  mocktail: ^1.0.5
  pubspec_parse: ^1.5.0
  # Read-only persisted-data audit tools use the resolved SQLite API directly.
  sqlite3: ^3.5.2
  test: ^1.31.0

  # Code generation
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  drift_dev: ^2.34.0

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  windows:
    generate: true
    icon_size: 48
  image_path: "assets/icons/AppIcon_1024.png"
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/translations/
    # Bundled Python worker for the run_python_script tool. Regenerate after
    # editing lib/core/services/script_runtime/worker/ — see CLAUDE.md.
    - assets/python/app.zip
    # Prebuilt skills offered in Settings > Skills. Each file is skill markdown
    # (front matter + body) parsed by SkillMarkdownParser, the same format the
    # skill editor edits.
    - assets/skills/

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
